<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桌面摸鱼猫 — 900海鱼·6大海域·猫咪进化·联机鱼塘</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    input { user-select: text; -webkit-user-select: text; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      margin: 0;
      min-height: 100vh;
    }
    .glass-panel {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
    .widget-mode-shell {
      max-width: 390px !important;
      margin: 1rem auto !important;
      border-radius: 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255,255,255,0.1);
    }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); border-radius: 99px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 99px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.55); }
  </style>
</head>
<body class="p-2 sm:p-4 flex flex-col items-center justify-start">

  <div id="appShell" class="w-full max-w-5xl transition-all duration-300">

    <!-- Top Header Bar -->
    <header class="glass-panel rounded-2xl px-3.5 py-2.5 mb-3 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-amber-500/20 border border-amber-400/30 flex items-center justify-center text-xl">🐱</div>
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-sm sm:text-base font-bold tracking-tight text-white leading-tight">桌面摸鱼猫</h1>
            <button id="roomBadgeBtn" class="flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 hover:bg-emerald-500/30 transition" title="查看联机房间">
              <span id="connDot" class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>
              <span id="roomBadgeText">房间: public · 3人</span>
            </button>
            <span id="zoneHeaderBadge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-300 border border-sky-400/30">🗺️ 浅海珊瑚湾</span>
            <button id="marketHeaderBtn" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/30 hover:bg-amber-500/30 transition">📈 鱼市行情</button>
          </div>
          <p class="text-[11px] text-slate-400 leading-tight">900种海鱼 · 6大海域 · 黄金鱼潮 · 猫咪进化</p>
        </div>
      </div>

      <!-- Resource Pills -->
      <div class="flex items-center gap-1.5 flex-wrap">
        <div class="flex items-center gap-1 bg-slate-900/70 border border-amber-500/30 px-2.5 py-1 rounded-full">
          <span class="text-sm">🪙</span>
          <span id="coinDisplay" class="text-sm font-bold text-amber-300 tabular-nums">80</span>
          <span id="cpsDisplay" class="text-[11px] text-emerald-400 font-medium">(+0/s)</span>
        </div>
        <div class="flex items-center gap-1 bg-slate-900/70 border border-fuchsia-500/30 px-2 py-1 rounded-full" title="远航珍珠：每颗永久+20%全局收益">
          <span class="text-xs">🦪</span>
          <span id="pearlDisplay" class="text-xs font-bold text-fuchsia-300 tabular-nums">0</span>
        </div>
        <div class="flex items-center gap-1 bg-slate-900/70 border border-sky-500/30 px-2 py-1 rounded-full">
          <span class="text-xs">🐟</span>
          <span id="tankCountDisplay" class="text-xs font-semibold text-sky-300 tabular-nums">0/5</span>
        </div>
        <button id="toggleModeBtn" class="px-2 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600/60 text-xs font-medium text-slate-200 transition active:scale-95">
          🪟 小窗
        </button>
        <button id="muteBtn" class="px-2 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600/60 text-xs font-medium text-slate-200 transition active:scale-95">
          🔊 音效
        </button>
      </div>
    </header>

    <!-- Main Layout Grid -->
    <div id="mainGrid" class="grid grid-cols-1 lg:grid-cols-12 gap-3">

      <!-- Left: Canvas Scene + Fever Bar + Controls -->
      <div id="sceneCol" class="lg:col-span-7 flex flex-col gap-3">
        <div class="glass-panel rounded-2xl p-2.5 relative overflow-hidden">
          <!-- Cat Status Strip -->
          <div class="flex flex-wrap items-center justify-between gap-2 mb-2 px-1">
            <div class="flex items-center gap-2 flex-wrap">
              <span id="catNameBadge" class="text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-400/30 px-2 py-0.5 rounded-lg">Lv.1 橘座</span>
              <span id="catTierBadge" class="text-[10px] font-semibold bg-fuchsia-500/20 text-fuchsia-200 border border-fuchsia-400/30 px-2 py-0.5 rounded-lg">✨ 幼猫学徒</span>
              <div class="flex items-center gap-1 text-xs text-slate-300">
                <span>❤️</span>
                <div class="w-11 h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                  <div id="moodBar" class="h-full bg-rose-400 transition-all duration-300" style="width: 85%"></div>
                </div>
              </div>
              <div class="flex items-center gap-1 text-xs text-slate-300">
                <span>🍖</span>
                <div class="w-11 h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                  <div id="hungerBar" class="h-full bg-amber-400 transition-all duration-300" style="width: 80%"></div>
                </div>
              </div>
            </div>
            <div id="coopBonusPill" class="text-[11px] text-emerald-300 font-medium">

            </div>
          </div>

          <!-- Canvas Wrapper -->

            <div id="feverBanner" class="hidden pointer-events-none absolute top-3 left-3 bg-gradient-to-r from-amber-500 to-rose-500 text-slate-950 text-[11px] font-extrabold px-2.5 py-0.5 rounded-full shadow-lg animate-pulse">

            <div id="pomoOverlayBadge" class="hidden pointer-events-none absolute bottom-2.5 left-2.5 bg-indigo-600/90 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full shadow">

            <div id="autoBadge" class="hidden pointer-events-none absolute top-2.5 right-2.5 bg-emerald-500/90 text-slate-950 text-[11px] font-bold px-2 py-0.5 rounded-full shadow">

            <button id="feverBtn" disabled class="shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-500 border border-slate-700 transition">

        <div class="grid grid-cols-6 gap-1 bg-slate-900/80 p-1 rounded-xl mb-2.5 shrink-0">
          <button data-tab="play" class="tab-btn py-1.5 rounded-lg text-[11px] font-semibold transition bg-sky-500 text-slate-950">🎯玩法</button>
          <button data-tab="shop" class="tab-btn py-1.5 rounded-lg text-[11px] font-semibold transition text-slate-300 hover:text-white">🛒升级</button>

        </div>

          <button id="resetBtn" class="text-slate-400 hover:text-rose-400 transition underline">重置进度</button>

    function generate900OceanFish() {
      const list = [];
      let index = 0;
      for (let p = 0; p < OCEAN_PREFIXES.length; p++) {
        const pref = OCEAN_PREFIXES[p];
        for (let b = 0; b < OCEAN_BASE_FISH.length; b++) {
          const base = OCEAN_BASE_FISH[b];
          index++;
          let rarity = 'common';
          if (index > 870) rarity = 'mythic';
          else if (index > 800) rarity = 'legendary';
          else if (index > 690) rarity = 'epic';
          else if (index > 520) rarity = 'rare';
          else if (index > 300) rarity = 'uncommon';

          const rm = RARITY_META[rarity];
          const variance = 0.85 + ((index * 37) % 35) / 100;
          const hue = (pref.hueShift + b * 11) % 360;
          const sat = rarity === 'mythic' ? 92 : rarity === 'legendary' ? 88 : 72;
          const light = rarity === 'common' ? 58 : 62;

          list.push({
            id: `ocean_${String(index).padStart(3, '0')}`,
            no: index,
            name: `${pref.prefix}${base.name}`,
            zone: pref.zone,
            emoji: base.emoji,
            shape: base.shape,
            rarity,
            rank: rm.rank,
            basePrice: Math.round(rm.basePrice * variance),
            cps: +(rm.baseCps * variance).toFixed(1),
            exp: Math.round(rm.baseExp * variance),
            bodyColor: `hsl(${hue}, ${sat}%, ${light}%)`,
            finColor: `hsl(${(hue + 35) % 360}, ${sat}%, ${Math.min(85, light + 16)}%)`,
            size: 13 + rm.rank * 2.1 + (b % 4)

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    }

    function playSound(type) {
      if (state.muted) return;
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'cast') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(520, now); osc.frequency.exponentialRampToValueAtTime(180, now + 0.16);
        gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.start(now); osc.stop(now + 0.18);
      } else if (type === 'bite') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(740, now); osc.frequency.setValueAtTime(980, now + 0.08);
        gain.gain.setValueAtTime(0.16, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.start(now); osc.stop(now + 0.24);
      } else if (type === 'catch') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.07); osc.frequency.setValueAtTime(784, now + 0.14);
        gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'coin') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(988, now); osc.frequency.setValueAtTime(1319, now + 0.06);
        gain.gain.setValueAtTime(0.11, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'meow') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(620, now); osc.frequency.exponentialRampToValueAtTime(860, now + 0.09); osc.frequency.exponentialRampToValueAtTime(500, now + 0.24);
        gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
        osc.start(now); osc.stop(now + 0.26);
      }
    }

    function stepLocalFishMarket() {
      let evBias = {};
      if (Math.random() < 0.28) {
        const ev = MARKET_EVENTS[Math.floor(Math.random() * MARKET_EVENTS.length)];
        fishMarket.news = ev.text;
        evBias = ev.bias || {};
      }
      for (const r of RARITY_ORDER) {
        const idx = fishMarket.indices[r];
        idx.prev = idx.mult;
        const meanPull = (1.05 - idx.mult) * 0.12;
        const noise = (Math.random() - 0.49) * 0.18;
        const next = Math.max(0.55, Math.min(2.40, +(idx.mult + meanPull + noise + (evBias[r] || 0)).toFixed(2)));
        idx.mult = next;
        idx.history.push(next);
        if (idx.history.length > 18) idx.history.shift();
      }
      updateMarketHeaderBadge();
      if (state.activeTab === 'play') renderTabContent();
      if (state.pendingCatch) renderCatchCard();
    }

    function nudgeMarket(rarity, delta) {
      const idx = fishMarket.indices[rarity];
      if (!idx) return;
      idx.prev = idx.mult;
      idx.mult = Math.max(0.55, Math.min(2.40, +(idx.mult + delta).toFixed(2)));
      idx.history.push(idx.mult);
      if (idx.history.length > 18) idx.history.shift();
    }

      const btn = document.getElementById('marketHeaderBtn');
      if (!btn) return;
      // Show highest booming rarity in header
      let bestR = 'mythic';
      let bestM = 0;
      for (const r of RARITY_ORDER) {
        const m = getMarketMult(r);
        if (m > bestM) { bestM = m; bestR = r; }
      }
      const rm = RARITY_META[bestR];
      btn.textContent = `📈 ${rm.label} ${bestM.toFixed(2)}x`;
    }

    function renderSparklineSvg(history, color) {
      if (!history || history.length < 2) return '';
      const w = 66, h = 22;
      const min = Math.min(...history, 0.55);
      const max = Math.max(...history, 1.5);
      const span = Math.max(0.05, max - min);
      const pts = history.map((v, i) => {
        const x = (i / (history.length - 1)) * w;
        const y = h - ((v - min) / span) * (h - 4) - 2;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="shrink-0 overflow-visible"><polyline fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/></svg>`;
    }

    // Real WebSocket Multiplayer Client (with Global Fish Market Sync)
    const online = {
      mode: 'live', ws: null, connected: false, clientId: null, friends: [], sharedFish: [],
      messages: [{ sender: '系统', text: '正在连接全服联机鱼塘与鱼市行情...', time: '刚刚', system: true }]
    };
    function wsSend(obj) { if (online.ws && online.ws.readyState === 1) { try { online.ws.send(JSON.stringify(obj)); } catch (e) {} } }
    function syncMyStateToServer() {
      wsSend({ type: 'state', nickname: state.nickname, skin: state.cat.skin, level: state.cat.level, glamour: state.catUpgrades.glamour || 0, coins: Math.floor(state.coins), fishingPhase: fishing.phase === 'waiting' ? 'waiting' : 'idle', bobberX: fishing.bobberX });
    }
    function connectWebSocket() {
      const proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
      if (online.ws) { try { online.ws.close(); } catch (e) {} }
      const ws = new WebSocket(proto + window.location.host);
      online.ws = ws;
      ws.onopen = () => {
        online.connected = true;
        document.getElementById('connDot').className = 'w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block';
        wsSend({ type: 'join', roomId: state.roomId, nickname: state.nickname, skin: state.cat.skin, level: state.cat.level, coins: Math.floor(state.coins), fishingPhase: fishing.phase === 'waiting' ? 'waiting' : 'idle' });
      };
      ws.onmessage = (ev) => {
        let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (msg.type === 'welcome') { online.clientId = msg.clientId; state.roomId = msg.roomId || state.roomId; renderHeader(); }
        else if (msg.type === 'market_sync' && msg.indices) {
          fishMarket.news = msg.news || fishMarket.news;
          fishMarket.indices = msg.indices;
          updateMarketHeaderBadge();
          if (state.activeTab === 'play') renderTabContent();
          if (state.pendingCatch) renderCatchCard();
        }
        else if (msg.type === 'room_sync') {
          online.friends = (msg.players || []).filter(p => p.id !== online.clientId).map(p => {
            const prev = online.friends.find(x => x.id === p.id);
            return Object.assign({ happyTimer: prev ? prev.happyTimer : 0, bobberX: p.bobberX || 0.72 }, p);
          });
          online.sharedFish = (msg.sharedFish || []).filter(sf => sf.ownerId !== online.clientId);
          if (Array.isArray(msg.messages)) online.messages = msg.messages;
          renderHeader(); if (state.activeTab === 'online') renderTabContent();
        } else if (msg.type === 'chat_broadcast') {
          if (msg.item) online.messages.push(msg.item);
          if (online.messages.length > 30) online.messages.shift();
          if (state.activeTab === 'online') renderTabContent();
        } else if (msg.type === 'pet_event') {
          if (msg.item) online.messages.push(msg.item);
          if (msg.targetId === online.clientId) {
            catAnim.happyTimer = 2.0; state.cat.mood = Math.min(100, state.cat.mood + 5); playSound('meow');
            spawnParticles(0.14, 0.22, `❤️ ${msg.fromName}摸了你!`, '#f472b6');
            showToast(`${msg.fromName} 摸了摸你的小猫！心情 +5`, 'gold');
          }
          renderHeader(); if (state.activeTab === 'online') renderTabContent();
        }
      };
      ws.onclose = () => {
        online.connected = false;
        const dot = document.getElementById('connDot');
        if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-rose-400 inline-block';
        setTimeout(connectWebSocket, 3000);
      };
    }

    const fishing = { phase: 'idle', timer: 0, biteWindow: 0, autoTimer: 0, bobberX: 0.56, bobberY: 0.48 };
    const particles = [];
    const bubbles = Array.from({ length: 16 }, () => ({ x: Math.random(), y: 0.48 + Math.random() * 0.5, r: 2 + Math.random() * 3.5, speed: 0.04 + Math.random() * 0.06 }));
    const catAnim = { blinkTimer: 2.5, blinking: false, happyTimer: 0, castSwing: 0 };

    function getCurrentZone() {
      return OCEAN_ZONES.find(z => z.id === state.zoneId) || OCEAN_ZONES[0];
    }

    function getGlobalMultiplier() {
      const zoneMult = getCurrentZone().mult;
      const pearlMult = 1 + (state.pearls || 0) * 0.20;
      const shrineMult = 1 + (state.upgrades.shrine || 0) * 0.35;
      const feverMult = runtime.feverLeft > 0 ? 3.0 : 1.0;
      return zoneMult * pearlMult * shrineMult * feverMult;
    }

    function getTankCapacity() { return 5 + (state.upgrades.tankCap || 0) * 2; }
    function getUpgradeCost(id) {
      const def = UPGRADE_DEFS.find(u => u.id === id);
      return Math.floor(def.baseCost * Math.pow(def.growth, state.upgrades[id] || 0));
    }
    function getCatUpgradeCost(id) {
      const def = CAT_UPGRADE_DEFS.find(u => u.id === id);
      return Math.floor(def.baseCost * Math.pow(def.growth, state.catUpgrades[id] || 0));
    }
    function getCatNextXp(lv) { return Math.floor(35 * Math.pow(1.38, lv - 1)); }
    function getCanCost() { return Math.floor(25 * Math.pow(1.25, state.cat.level - 1)); }
    function getCoopBonusPct() { return Math.min(50, online.sharedFish.length * 5); }

    function getTotalCps() {
      const foodMult = 1 + (state.upgrades.fishFood || 0) * 0.25;
      const glamourMult = 1 + (state.catUpgrades.glamour || 0) * 0.18;
      const catMult = 1 + (state.cat.level - 1) * 0.12 + (state.cat.mood >= 70 ? 0.15 : 0);
      const coopMult = 1 + getCoopBonusPct() / 100;
      const shellBase = (state.upgrades.pearlFarm || 0) * 3.5;
      let sum = shellBase;
      for (const f of state.tankFish) {
        const sp = getFishById(f.speciesId);
        const stageMult = f.growth >= 100 ? 1.8 : (f.growth >= 50 ? 1.3 : 1.0);
        sum += sp.cps * stageMult;
      }
      return sum * foodMult * glamourMult * catMult * coopMult * getGlobalMultiplier();
    }

    function getFishSellPrice(fishObj) {
      const sp = getFishById(fishObj.speciesId);
      const growthMult = 1 + ((fishObj.growth || 10) / 100) * 1.4;
      const sellBonus = 1 + (state.upgrades.autoSell || 0) * 0.12 + (state.upgrades.bait || 0) * 0.05;
      return Math.round(sp.basePrice * growthMult * sellBonus * getGlobalMultiplier() * getMarketMult(sp.rarity));
    }

    function getPrestigePearlsEarned() {
      if (state.coins < 50000) return 0;
      return Math.max(1, Math.floor(Math.sqrt(state.coins / 15000)));
    }

    function saveGame() {
      state.lastSavedAt = Date.now();
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function loadGame() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed.coins !== 'number') return;
        const def = createDefaultState();
        state = Object.assign(def, parsed);
        state.cat = Object.assign(def.cat, parsed.cat || {});
        state.upgrades = Object.assign(def.upgrades, parsed.upgrades || {});
        state.catUpgrades = Object.assign(def.catUpgrades, parsed.catUpgrades || {});
        state.stats = Object.assign(def.stats, parsed.stats || {});
        state.questTiers = Object.assign(def.questTiers, parsed.questTiers || {});
        state.marketHoldings = Object.assign(def.marketHoldings, parsed.marketHoldings || {});
        if (!Array.isArray(state.unlockedZones)) state.unlockedZones = ['coral'];
        if (!Array.isArray(state.tankFish)) state.tankFish = [];
        state.tankFish = state.tankFish.map(f => FISH_MAP.has(f.speciesId) ? f : Object.assign({}, f, { speciesId: 'ocean_006' }));
        if (!state.dex || typeof state.dex !== 'object') state.dex = {};
        if (state.pendingCatch && !FISH_MAP.has(state.pendingCatch.speciesId)) state.pendingCatch = null;

        const elapsedSec = Math.min(3600 * 8, Math.floor((Date.now() - (parsed.lastSavedAt || Date.now())) / 1000));
        const cps = getTotalCps();
        if (elapsedSec >= 30 && cps > 0) {
          const earned = Math.floor(cps * elapsedSec * 0.5);
          if (earned > 0) {
            state.coins += earned;
            showModal('欢迎回来，摸鱼快乐！', `你离开的 ${Math.floor(elapsedSec / 60)} 分钟里，海底鱼缸为你悄悄赚了 🪙 ${earned.toLocaleString()} 金币！`, false);
          }
        }
      } catch (e) {
        state = createDefaultState();
      }
    }

    // =========================================================
    // 5. UI Helpers
    // =========================================================
    function showToast(text, tone = 'info') {
      const layer = document.getElementById('toastLayer');
      const el = document.createElement('div');
      const colors = {
        info: 'bg-slate-800/95 border-slate-600 text-slate-100',
        good: 'bg-emerald-900/95 border-emerald-500/60 text-emerald-200',
        gold: 'bg-amber-900/95 border-amber-400/70 text-amber-200',
        warn: 'bg-rose-900/95 border-rose-500/60 text-rose-200'
      };
      el.className = `px-3 py-1.5 rounded-xl border text-xs font-semibold shadow-lg ${colors[tone] || colors.info}`;
      el.textContent = text;
      layer.appendChild(el);
      setTimeout(() => {
        el.style.transition = 'opacity 0.35s, transform 0.35s';
        el.style.opacity = '0'; el.style.transform = 'translateY(-8px)';
        setTimeout(() => el.remove(), 380);
      }, 2100);
    }

    let modalCallback = null;
    function showModal(title, body, showCancel = false, onConfirm = null) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').textContent = body;
      document.getElementById('modalCancelBtn').classList.toggle('hidden', !showCancel);
      modalCallback = onConfirm;
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
      modalCallback = null;
    }

    function spawnParticles(nx, ny, text, color = '#fbbf24') {
      particles.push({ x: nx, y: ny, vy: -0.14, text, color, life: 1.0 });
    }

    function addChatMessage(sender, text, isSystem = false) {
      const now = new Date();
      const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      online.messages.push({ sender, text, time, system: isSystem });
      if (online.messages.length > 30) online.messages.shift();
      if (state.activeTab === 'online') renderTabContent();
    }

    function copyInviteLink() {
      const url = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(state.roomId)}`;
      const fallbackCopy = (str) => {
        const ta = document.createElement('textarea');
        ta.value = str; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        ta.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).catch(() => fallbackCopy(url));
      else fallbackCopy(url);
      showToast(`已复制房间邀请链接！发给好友点开就能进同一个鱼塘`, 'good');
    }

    // =========================================================
    // 6. Core Gameplay + New Loops (Zones, Fever, Chests, Pomo, Quests, Prestige)
    // =========================================================
    function addFeverEnergy(amount) {
      if (runtime.feverLeft > 0) return;
      const mult = 1 + (state.upgrades.feverCore || 0) * 0.18;
      state.feverEnergy = Math.min(100, (state.feverEnergy || 0) + amount * mult);
      renderFeverBar();
    }

    function activateFever() {
      if (state.feverEnergy < 100 || runtime.feverLeft > 0) return;
      initAudio();
      state.feverEnergy = 0;
      runtime.feverLeft = 20 + (state.upgrades.feverCore || 0) * 3;
      playSound('catch');
      spawnParticles(0.5, 0.35, '🔥 黄金鱼潮开启 x3!', '#fbbf24');
      showToast(`🔥 黄金鱼潮爆发 ${runtime.feverLeft} 秒！收益×3、极品率暴涨！`, 'gold');
      renderFeverBar();
      renderHeader();
    }

    function openTreasureChest() {
      initAudio();
      if ((state.chests || 0) <= 0) {
        showToast('暂无沉船宝箱，钓鱼或在「沉船宝藏礁」垂钓有概率捞出宝箱！', 'info');
        return;
      }
      state.chests -= 1;
      state.stats.chestsOpened = (state.stats.chestsOpened || 0) + 1;
      playSound('catch');

      const roll = Math.random();
      const baseGold = Math.max(150, Math.round(getTotalCps() * 45 + 120 * getGlobalMultiplier()));
      if (roll < 0.25) {
        const pearlGain = 1 + (Math.random() < 0.35 ? 1 : 0);
        state.pearls = (state.pearls || 0) + pearlGain;
        showToast(`🎁 沉船宝箱爆出 🦪 海洋珍珠 +${pearlGain}（永久全局收益+${pearlGain * 20}%）！`, 'gold');
        spawnParticles(0.5, 0.35, `🦪 珍珠+${pearlGain}!`, '#f472b6');
      } else if (roll < 0.65) {
        const rareFish = rollFish(true, 'rare');
        recordDex(rareFish.speciesId, rareFish.weight);
        state.pendingCatch = rareFish;
        const sp = getFishById(rareFish.speciesId);
        showToast(`🎁 宝箱里藏着【${RARITY_META[sp.rarity].label}】${sp.name} + 🪙${baseGold}！`, 'gold');
        state.coins += baseGold;
        renderCatchCard();
      } else {
        const jackpot = baseGold * 2;
        state.coins += jackpot;
        const gained = gainCatXp(55);
        showToast(`🎁 黄金沉船宝藏！获得 🪙${jackpot.toLocaleString()} + 猫咪经验 ${gained}！`, 'gold');
        spawnParticles(0.5, 0.35, `🎁 +🪙${jackpot}`, '#fbbf24');
      }
      renderHeader();
      renderTabContent();
      saveGame();
    }

    function rollFish(perfectBonus = false, minRarity = null) {
      const zoneLuck = getCurrentZone().luckBonus;
      const rodLuck = (state.upgrades.rod || 0) * 0.032;
      const sonarLuck = (state.upgrades.sonar || 0) * 0.028;
      const pawLuck = (state.catUpgrades.luckyPaw || 0) * 0.022;
      const catLuck = (state.cat.level - 1) * 0.012;
      const feverLuck = runtime.feverLeft > 0 ? 0.25 : 0;
      const bonus = zoneLuck + rodLuck + sonarLuck + pawLuck + catLuck + feverLuck + (perfectBonus ? 0.14 : 0);

      const r = Math.random();
      let rarity = 'common';
      if (r < Math.min(0.14, 0.006 + bonus * 0.14)) rarity = 'mythic';
      else if (r < Math.min(0.30, 0.025 + bonus * 0.30)) rarity = 'legendary';
      else if (r < Math.min(0.52, 0.08 + bonus * 0.58)) rarity = 'epic';
      else if (r < Math.min(0.75, 0.22 + bonus * 0.88)) rarity = 'rare';
      else if (r < Math.min(0.92, 0.48 + bonus)) rarity = 'uncommon';

      if (minRarity && RARITY_META[rarity].rank < RARITY_META[minRarity].rank) {
        rarity = minRarity;
      }

      const pool = FISH_BY_RARITY[rarity];
      const sp = pool[Math.floor(Math.random() * pool.length)] || FISH_SPECIES[0];
      const weight = +(0.6 + Math.random() * 2.8 * RARITY_META[rarity].mult).toFixed(1);
      return { uid: 'f_' + Date.now() + '_' + Math.floor(Math.random() * 9999), speciesId: sp.id, weight, growth: 10 };
    }

    function recordDex(speciesId, weight) {
      if (!state.dex[speciesId]) {
        state.dex[speciesId] = { count: 1, bestWeight: weight };
        const sp = getFishById(speciesId);
        showToast(`📖 解锁新海鱼 #${sp.no} ${sp.name}（${RARITY_META[sp.rarity].label}）！`, 'gold');
      } else {
        state.dex[speciesId].count += 1;
        if (weight > state.dex[speciesId].bestWeight) state.dex[speciesId].bestWeight = weight;
      }
    }

    function handleFishingAction() {
      initAudio();
      if (fishing.phase === 'idle') {
        fishing.phase = 'waiting';
        const baitReduce = Math.min(0.65, (state.upgrades.bait || 0) * 0.065);
        const feverSpeed = runtime.feverLeft > 0 ? 0.55 : 1.0;
        fishing.timer = Math.max(0.45, (1.4 + Math.random() * 2.1) * (1 - baitReduce) * feverSpeed);
        fishing.bobberX = 0.50 + Math.random() * 0.14;
        fishing.bobberY = 0.49;
        catAnim.castSwing = 1.0;
        playSound('cast');
        updateFishingUI();
      } else if (fishing.phase === 'waiting') {
        fishing.phase = 'idle';
        showToast('海鱼还没咬钩，稍微耐心等一下哦', 'info');
        updateFishingUI();
      } else if (fishing.phase === 'biting') {
        const perfect = fishing.biteWindow > 1.2;
        const caught = rollFish(perfect);
        fishing.phase = 'idle';
        state.stats.totalCaught = (state.stats.totalCaught || 0) + 1;
        recordDex(caught.speciesId, caught.weight);
        state.pendingCatch = caught;
        catAnim.happyTimer = 1.5;
        addFeverEnergy(perfect ? 18 : 12);
        playSound('catch');
        const sp = getFishById(caught.speciesId);

        // Multi-hook extra catch coins
        const mhChance = (state.upgrades.multiHook || 0) * 0.12;
        if (Math.random() < mhChance) {
          const extra = Math.round(sp.basePrice * getGlobalMultiplier());
          state.coins += extra;
          showToast(`🪝 多重串钩连钓！额外入账 🪙 ${extra.toLocaleString()}`, 'good');
        }

        // Lucky paw crit
        const critChance = (state.catUpgrades.luckyPaw || 0) * 0.06;
        if (Math.random() < critChance) {
          const bonusCoin = Math.round(sp.basePrice * getGlobalMultiplier());
          state.coins += bonusCoin;
          showToast(`🍀 招财猫爪暴击！额外获得 🪙 ${bonusCoin.toLocaleString()}`, 'gold');
        }

        // Treasure chest drop roll
        const zoneChestMult = state.zoneId === 'wreck' ? 2.0 : 1.0;
        const chestChance = (0.06 + (state.upgrades.treasureNet || 0) * 0.025) * zoneChestMult;
        if (Math.random() < chestChance) {
          state.chests = (state.chests || 0) + 1;
          showToast('🎁 捞到一个神秘沉船宝箱！快点下方宝箱按钮开启', 'gold');
        }

        spawnParticles(fishing.bobberX, 0.44, `${sp.emoji} ${sp.name}!`, RARITY_META[sp.rarity].color);
        if (sp.rarity === 'legendary' || sp.rarity === 'mythic') {
          addChatMessage('系统', `🎉 ${state.nickname} 在${getCurrentZone().name}钓到了【${RARITY_META[sp.rarity].label}】#${sp.no} ${sp.name}！`, true);
        } else if (perfect) {
          showToast(`✨ 完美拉杆！钓到 ${sp.name} (${caught.weight}kg)`, 'gold');
        }
        updateFishingUI();
        renderCatchCard();
        renderHeader();
        renderTabContent();
        saveGame();
      }
    }

    function triggerAutoFish() {
      const caught = rollFish(false);
      state.stats.totalCaught = (state.stats.totalCaught || 0) + 1;
      recordDex(caught.speciesId, caught.weight);
      addFeverEnergy(5);
      const sp = getFishById(caught.speciesId);
      if (state.tankFish.length < getTankCapacity() && (sp.rank >= 3 || state.tankFish.length < 3)) {
        addFishToTank(caught, true);
        spawnParticles(0.55, 0.46, `⚙️ +${sp.emoji}入缸`, '#38bdf8');
      } else {
        const earn = Math.round(sp.basePrice * getGlobalMultiplier());
        state.coins += earn;
        spawnParticles(0.55, 0.46, `⚙️ +🪙${earn}`, '#fbbf24');
      }
      renderHeader();
      if (state.activeTab === 'tank' || state.activeTab === 'dex' || state.activeTab === 'play') renderTabContent();
    }

    function addFishToTank(fishObj, silent = false) {
      if (state.tankFish.length >= getTankCapacity()) {
        if (!silent) showToast('海底鱼缸已满！去“升级”扩容或卖掉大鱼吧', 'warn');
        return false;
      }
      state.tankFish.push({
        uid: fishObj.uid,
        speciesId: fishObj.speciesId,
        growth: fishObj.growth || 10,
        x: 0.15 + Math.random() * 0.7,
        y: 0.56 + Math.random() * 0.34,
        vx: (Math.random() > 0.5 ? 1 : -1) * (0.04 + Math.random() * 0.05),
        vy: (Math.random() - 0.5) * 0.015,
        phase: Math.random() * Math.PI * 2
      });
      return true;
    }

    function gainCatXp(rawAmount) {
      const gourmetMult = 1 + (state.catUpgrades.gourmet || 0) * 0.3;
      const amount = Math.round(rawAmount * gourmetMult);
      const prevEvo = getCatEvolution(state.cat.level).title;
      state.cat.xp += amount;
      let needed = getCatNextXp(state.cat.level);
      let leveled = false;
      while (state.cat.xp >= needed) {
        state.cat.xp -= needed;
        state.cat.level += 1;
        needed = getCatNextXp(state.cat.level);
        leveled = true;
      }
      if (leveled) {
        const newEvo = getCatEvolution(state.cat.level);
        if (newEvo.title !== prevEvo) {
          showToast(`🌟 外观进化！小猫晋升【${newEvo.title}】(${newEvo.desc})`, 'gold');
          addChatMessage('系统', `👑 ${state.nickname} 的猫咪进化为【${newEvo.title}】(Lv.${state.cat.level})！`, true);
        } else {
          showToast(`🎉 小猫升到 Lv.${state.cat.level}！颜值与产币加成提升`, 'gold');
        }
        spawnParticles(0.14, 0.22, `✨ Lv.${state.cat.level}!`, '#fbbf24');
      }
      return amount;
    }

    function petCat() {
      initAudio();
      state.stats.totalPets = (state.stats.totalPets || 0) + 1;
      const petLv = state.catUpgrades.petSkill || 0;
      const coinBonus = Math.round(petLv * 4 * getGlobalMultiplier());
      const xpGain = 5 + petLv * 3;
      state.cat.mood = Math.min(100, state.cat.mood + 8);
      if (coinBonus > 0) state.coins += coinBonus;
      gainCatXp(xpGain);
      addFeverEnergy(4);
      catAnim.happyTimer = 1.4;
      playSound('meow');
      spawnParticles(0.14 + (Math.random() - 0.5) * 0.06, 0.24, coinBonus > 0 ? `❤️ +🪙${coinBonus}` : '❤️ 呼噜~', '#fb7185');
      renderHeader();
      if (state.activeTab === 'cat' || state.activeTab === 'play') renderTabContent();
    }

    function getCanPrice(canId) {
      const def = CAT_CANS.find(c => c.id === canId) || CAT_CANS[0];
      return Math.floor(def.baseCost * Math.pow(1.18, state.cat.level - 1));
    }

    function buyCatCan(canId = 'seafood') {
      initAudio();
      const def = CAT_CANS.find(c => c.id === canId) || CAT_CANS[1];
      const cost = getCanPrice(def.id);
      if (state.coins < cost) { showToast(`购买${def.name}需要 🪙 ${cost.toLocaleString()} 金币`, 'warn'); return; }
      state.coins -= cost;
      state.cat.hunger = Math.min(100, state.cat.hunger + def.hunger);
      state.cat.mood = Math.min(100, state.cat.mood + def.mood);
      const scaledExp = Math.round(def.exp * Math.pow(1.18, state.cat.level - 1));
      const gained = gainCatXp(scaledExp);
      catAnim.happyTimer = 2.0;
      playSound('meow');
      spawnParticles(0.14, 0.24, `${def.icon} +${gained} EXP`, '#fbbf24');
      showToast(`给小猫吃了${def.name}！获得 +${gained} 经验`, 'gold');
      renderHeader(); renderTabContent(); saveGame();
    }

    function craftCanFromPending() {
      if (!state.pendingCatch) return;
      const sp = getFishById(state.pendingCatch.speciesId);
      const qty = Math.max(1, sp.rank);
      state.homemadeCans = (state.homemadeCans || 0) + qty;
      state.pendingCatch = null;
      playSound('coin');
      showToast(`🥫 用 ${sp.name} 做成了 ${qty} 个鲜鱼罐头！可在「猫咪」里随时投喂`, 'gold');
      renderCatchCard(); renderHeader(); renderTabContent(); saveGame();
    }

    function useHomemadeCan() {
      initAudio();
      if ((state.homemadeCans || 0) <= 0) { showToast('还没有自制鲜鱼罐头，钓到鱼后点「做罐头」即可制作！', 'info'); return; }
      state.homemadeCans -= 1;
      state.cat.hunger = Math.min(100, state.cat.hunger + 50);
      state.cat.mood = Math.min(100, state.cat.mood + 20);
      const gained = gainCatXp(Math.round(45 * Math.pow(1.18, state.cat.level - 1)));
      catAnim.happyTimer = 2.0;
      playSound('meow');
      spawnParticles(0.14, 0.24, `🥫 +${gained} EXP`, '#f472b6');
      showToast(`喂了 1 个自制鲜鱼罐头！获得 +${gained} 经验`, 'gold');
      renderHeader(); renderTabContent(); saveGame();
    }

    function feedTankFish(uid) {
      const idx = state.tankFish.findIndex(f => f.uid === uid);
      if (idx === -1) return;
      const f = state.tankFish[idx];
      const sp = getFishById(f.speciesId);
      const growthBonus = 1 + (f.growth || 10) / 100;
      state.tankFish.splice(idx, 1);
      state.cat.hunger = Math.min(100, state.cat.hunger + 30);
      state.cat.mood = Math.min(100, state.cat.mood + 15);
      const gained = gainCatXp(Math.round(sp.exp * growthBonus));
      catAnim.happyTimer = 1.8;
      playSound('meow');
      spawnParticles(0.14, 0.24, `🍖 +${gained} EXP`, '#fbbf24');
      showToast(`把养大的 ${sp.name} 喂给了小猫，获得 +${gained} 经验！`, 'gold');
      renderHeader(); renderTabContent(); saveGame();
    }

    function buyCatUpgrade(id) {
      const def = CAT_UPGRADE_DEFS.find(u => u.id === id);
      const lv = state.catUpgrades[id] || 0;
      const cost = getCatUpgradeCost(id);
      if (state.coins < cost) { showToast(`需要 🪙 ${cost} 金币才能升级 ${def.name}`, 'warn'); return; }
      state.coins -= cost;
      state.catUpgrades[id] = lv + 1;
      catAnim.happyTimer = 1.8;
      playSound('catch');
      spawnParticles(0.14, 0.22, `${def.icon} Lv.${lv + 1}!`, '#f472b6');
      showToast(`✨ ${def.name} 升至 Lv.${lv + 1}！猫咪更强更好看了`, 'gold');
      renderHeader(); renderTabContent(); saveGame();
    }

    function unlockOrSwitchZone(zoneId) {
      const z = OCEAN_ZONES.find(x => x.id === zoneId);
      if (!z) return;
      if (state.unlockedZones.includes(zoneId)) {
        state.zoneId = zoneId;
        playSound('cast');
        showToast(`⛵ 已启航前往【${z.name}】（产币 ×${z.mult}）`, 'good');
      } else {
        if (state.coins < z.cost) {
          showToast(`解锁【${z.name}】需要 🪙 ${z.cost.toLocaleString()} 金币`, 'warn');
          return;
        }
        state.coins -= z.cost;
        state.unlockedZones.push(zoneId);
        state.zoneId = zoneId;
        playSound('catch');
        showToast(`🎉 解锁新海域【${z.name}】！全收益 ×${z.mult}`, 'gold');
      }
      renderHeader(); renderTabContent(); saveGame();
    }

    function claimQuest(questId) {
      const q = QUEST_TEMPLATES.find(x => x.id === questId);
      if (!q) return;
      const tier = state.questTiers[questId] || 0;
      const goal = Math.round(q.baseGoal * Math.pow(q.mult, tier));
      const curVal = q.stat === 'dexCount' ? Object.keys(state.dex).length : (state.stats[q.stat] || 0);
      if (curVal < goal) return;

      const coinReward = Math.round(q.rewardCoins * Math.pow(1.9, tier));
      const pearlReward = q.rewardPearls > 0 ? q.rewardPearls + Math.floor(tier / 2) : (tier >= 2 ? 1 : 0);
      state.coins += coinReward;
      state.pearls = (state.pearls || 0) + pearlReward;
      state.questTiers[questId] = tier + 1;
      playSound('coin');
      showToast(`✅ 完成悬赏「${q.title}」！获得 🪙${coinReward.toLocaleString()}${pearlReward ? ` + 🦪${pearlReward}` : ''}`, 'gold');
      renderHeader(); renderTabContent(); saveGame();
    }

    function togglePomodoro(minutes) {
      if (runtime.pomoActive) {
        runtime.pomoActive = false;
        showToast('已暂停专注番茄钟', 'info');
      } else {
        runtime.pomoTotalSec = minutes * 60;
        runtime.pomoLeftSec = minutes * 60;
        runtime.pomoActive = true;
        showToast(`⏱️ 开启 ${minutes} 分钟专注摸鱼！倒计时结束必出史诗/神话海鱼`, 'good');
      }
      renderHeader(); renderTabContent();
    }

    function doPrestige() {
      const earnPearls = getPrestigePearlsEarned();
      if (earnPearls <= 0) {
        showToast('金币达到 🪙 50,000 后即可远航转生换取永久珍珠！', 'warn');
        return;
      }
      showModal(
        '⛵ 远航转生确认',
        `本次远航将重置当前金币、普通升级与鱼缸，但永久保留【900种图鉴、猫咪皮肤、猫咪等级】并立刻获得 🦪 ${earnPearls} 颗海洋珍珠（永久全局收益 +${earnPearls * 20}%）！确定出发吗？`,
        true,
        () => {
          state.pearls = (state.pearls || 0) + earnPearls;
          state.prestigeCount = (state.prestigeCount || 0) + 1;
          state.coins = 100;
          state.chests = (state.chests || 0) + 2;
          state.zoneId = 'coral';
          state.unlockedZones = ['coral'];
          state.upgrades = createDefaultState().upgrades;
          state.tankFish = [{ uid: 'p_' + Date.now(), speciesId: 'ocean_006', growth: 45, x: 0.35, y: 0.68, vx: 0.05, vy: 0.01, phase: 0.4 }];
          state.pendingCatch = null;
          playSound('catch');
          showToast(`⛵ 远航成功！获得 🦪 ${earnPearls} 珍珠 + 2个沉船宝箱`, 'gold');
          renderHeader(); renderCatchCard(); renderTabContent(); saveGame();
        }
      );
    }

    function petFriendCat(friendId) {
      initAudio();
      const f = online.friends.find(x => x.id === friendId);
      if (!f) return;
      f.happyTimer = 2.0;
      state.coins += 5;
      playSound('meow');
      const idx = online.friends.indexOf(f);
      spawnParticles(0.28 + idx * 0.13, 0.24, '❤️ 被摸了!', '#f472b6');
      showToast(`摸了 ${f.nickname} 的猫，获得友情奖励 +🪙5！`, 'good');
      wsSend({ type: 'pet_friend', targetId: friendId });
      renderHeader();
    }

    function sendChat(text) {
      const clean = (text || '').trim().slice(0, 40);
      if (!clean) return;
      wsSend({ type: 'chat', text: clean });
      spawnParticles(0.14, 0.18, clean.slice(0, 10), '#e2e8f0');
    }

    function joinRoom(newNick, newRoom) {
      const nick = (newNick || '').trim().slice(0, 12) || '摸鱼达人';
      const room = (newRoom || '').trim().replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 16) || 'public';
      state.nickname = nick; state.roomId = room; saveGame();
      wsSend({ type: 'join', roomId: room, nickname: nick, skin: state.cat.skin, level: state.cat.level, coins: Math.floor(state.coins), fishingPhase: fishing.phase === 'waiting' ? 'waiting' : 'idle' });
      showToast(`已切换到房间：${room}`, 'good');
      renderHeader(); renderTabContent();
    }

    function keepPendingFish() {
      if (!state.pendingCatch) return;
      if (addFishToTank(state.pendingCatch)) {
        const sp = getFishById(state.pendingCatch.speciesId);
        wsSend({ type: 'add_fish', speciesId: sp.id });
        showToast(`已将 ${sp.name} 放入共享海底鱼塘！`, 'good');
        state.pendingCatch = null; playSound('cast');
        renderCatchCard(); renderHeader(); renderTabContent(); saveGame();
      }
    }

    function feedPendingFish() {
      if (!state.pendingCatch) return;
      const sp = getFishById(state.pendingCatch.speciesId);
      state.cat.hunger = Math.min(100, state.cat.hunger + 22);
      state.cat.mood = Math.min(100, state.cat.mood + 12);
      const gained = gainCatXp(sp.exp);
      catAnim.happyTimer = 1.8; playSound('meow');
      spawnParticles(0.14, 0.25, `🍖 +${gained} EXP`, '#fbbf24');
      showToast(`小猫吃掉了 ${sp.name}，获得 +${gained} 经验！`, 'gold');
      state.pendingCatch = null;
      renderCatchCard(); renderHeader(); renderTabContent(); saveGame();
    }

    function sellPendingFish() {
      if (!state.pendingCatch) return;
      const sp = getFishById(state.pendingCatch.speciesId);
      const price = Math.round(sp.basePrice * getGlobalMultiplier() * getMarketMult(sp.rarity));
      state.coins += price; playSound('coin');
      spawnParticles(0.5, 0.4, `+🪙${price}`, '#34d399');
      showToast(`卖出 ${sp.name}，获得 🪙 ${price.toLocaleString()}`, 'good');
      state.pendingCatch = null;
      renderCatchCard(); renderHeader(); renderTabContent(); saveGame();
    }

    function sellTankFish(uid) {
      const idx = state.tankFish.findIndex(f => f.uid === uid);
      if (idx === -1) return;
      const f = state.tankFish[idx];
      const sp = getFishById(f.speciesId);
      const price = getFishSellPrice(f);
      state.tankFish.splice(idx, 1);
      state.coins += price; playSound('coin');
      spawnParticles(f.x, f.y, `+🪙${price}`, '#34d399');
      showToast(`卖出 ${sp.name}，入账 🪙 ${price.toLocaleString()}`, 'good');
      renderHeader(); renderTabContent(); saveGame();
    }

    function buyUpgrade(id) {
      const def = UPGRADE_DEFS.find(u => u.id === id);
      const lv = state.upgrades[id] || 0;
      const cost = getUpgradeCost(id);
      if (state.coins < cost) { showToast('金币还不够，再多钓几条海鱼吧！', 'warn'); return; }
      state.coins -= cost;
      state.upgrades[id] = lv + 1;
      playSound('coin');
      showToast(`✨ ${def.name} 升至 Lv.${lv + 1}！`, 'gold');
      renderHeader(); renderTabContent(); saveGame();
    }

    function selectOrBuySkin(skinId) {
      const skin = CAT_SKINS.find(s => s.id === skinId);
      if (!skin) return;
      if (state.cat.unlockedSkins.includes(skinId)) {
        state.cat.skin = skinId; playSound('meow'); showToast(`已切换为 ${skin.name}`, 'info');
      } else {
        if (state.coins < skin.cost) { showToast(`需要 🪙 ${skin.cost} 金币才能解锁 ${skin.name}`, 'warn'); return; }
        state.coins -= skin.cost; state.cat.unlockedSkins.push(skinId); state.cat.skin = skinId;
        playSound('catch'); showToast(`🎉 解锁新猫咪：${skin.name}！`, 'gold');
      }
      renderHeader(); renderTabContent(); saveGame();
    }

    // =========================================================
    // 7. DOM Rendering
    // =========================================================
    function formatSec(sec) {
      const s = Math.max(0, Math.ceil(sec));
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    function renderFeverBar() {
      const pct = runtime.feverLeft > 0 ? 100 : Math.min(100, Math.round(state.feverEnergy || 0));
      document.getElementById('feverBar').style.width = `${pct}%`;
      const btn = document.getElementById('feverBtn');
      const banner = document.getElementById('feverBanner');
      if (runtime.feverLeft > 0) {
        banner.classList.remove('hidden');
        document.getElementById('feverRemainTxt').textContent = Math.ceil(runtime.feverLeft);
        btn.disabled = true;
        btn.className = 'shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold bg-rose-500/30 text-rose-200 border border-rose-400/50';
        btn.textContent = `爆发中 ${Math.ceil(runtime.feverLeft)}s`;
      } else if (pct >= 100) {
        banner.classList.add('hidden');
        btn.disabled = false;
        btn.className = 'shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-extrabold bg-gradient-to-r from-amber-400 to-rose-500 text-slate-950 animate-pulse shadow cursor-pointer';
        btn.textContent = '🔥 开启鱼潮!';
      } else {
        banner.classList.add('hidden');
        btn.disabled = true;
        btn.className = 'shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-400 border border-slate-700';
        btn.textContent = `充能 ${pct}%`;
      }
    }

    function renderHeader() {
      const cps = getTotalCps();
      const zone = getCurrentZone();
      document.getElementById('coinDisplay').textContent = Math.floor(state.coins).toLocaleString();
      document.getElementById('cpsDisplay').textContent = `(+${cps.toFixed(1)}/s)`;
      document.getElementById('pearlDisplay').textContent = state.pearls || 0;
      document.getElementById('tankCountDisplay').textContent = `${state.tankFish.length}/${getTankCapacity()}`;
      document.getElementById('roomBadgeText').textContent = `房间: ${state.roomId} · ${online.friends.length + 1}人`;
      document.getElementById('zoneHeaderBadge').textContent = `${zone.icon} ${zone.name}`;
      document.getElementById('coopBonusPill').textContent = `🤝 联机 +${getCoopBonusPct()}%`;
      document.getElementById('chestCountTxt').textContent = `宝箱(${state.chests || 0})`;

      const skin = CAT_SKINS.find(s => s.id === state.cat.skin) || CAT_SKINS[0];
      const evo = getCatEvolution(state.cat.level);
      document.getElementById('catNameBadge').textContent = `Lv.${state.cat.level} ${skin.name}`;
      document.getElementById('catTierBadge').textContent = `✨ ${evo.title}`;
      document.getElementById('moodBar').style.width = `${Math.round(state.cat.mood)}%`;
      document.getElementById('hungerBar').style.width = `${Math.round(state.cat.hunger)}%`;
      document.getElementById('autoBadge').classList.toggle('hidden', (state.upgrades.autoFish || 0) <= 0);

      const pomoBadge = document.getElementById('pomoOverlayBadge');
      pomoBadge.classList.toggle('hidden', !runtime.pomoActive);
      if (runtime.pomoActive) document.getElementById('pomoTimeMini').textContent = formatSec(runtime.pomoLeftSec);
      renderFeverBar();
    }

    function updateFishingUI() {
      const btn = document.getElementById('fishBtn');
      const txt = document.getElementById('fishBtnText');
      const alertEl = document.getElementById('biteAlert');

      if (fishing.phase === 'idle') {
        btn.className = 'col-span-2 py-2.5 px-3 rounded-xl bg-gradient-to-r from-sky-500 to-cyan-500 hover:from-sky-400 hover:to-cyan-400 text-slate-950 font-bold text-sm shadow-lg shadow-sky-500/20 transition active:scale-[0.98] flex items-center justify-center gap-1.5';
        txt.textContent = '抛竿海钓 (空格)';
        alertEl.classList.add('hidden');
      } else if (fishing.phase === 'waiting') {
        btn.className = 'col-span-2 py-2.5 px-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold text-sm transition flex items-center justify-center gap-1.5';
        txt.textContent = '等待海鱼咬钩...';
        alertEl.classList.add('hidden');
      } else if (fishing.phase === 'biting') {
        btn.className = 'col-span-2 py-2.5 px-3 rounded-xl bg-gradient-to-r from-rose-500 to-amber-500 hover:from-rose-400 hover:to-amber-400 text-white font-extrabold text-sm shadow-lg shadow-rose-500/35 animate-pulse flex items-center justify-center gap-1.5';
        txt.textContent = '❗ 立即收竿！(空格)';
        alertEl.classList.remove('hidden');
      }
    }

    function renderCatchCard() {
      const iconEl = document.getElementById('catchIcon');
      const titleEl = document.getElementById('catchTitle');
      const descEl = document.getElementById('catchDesc');
      const actionsEl = document.getElementById('catchActions');

      if (!state.pendingCatch) {
        iconEl.textContent = '🎣';
        titleEl.textContent = '900种海洋鱼 · 6大海域等你探索';
        descEl.textContent = '攒满鱼潮能量可开启 3 倍爆率，捞到沉船宝箱可开出稀有大鱼与珍珠！';
        actionsEl.classList.add('hidden');
        return;
      }
      const sp = getFishById(state.pendingCatch.speciesId);
      const rm = RARITY_META[sp.rarity];
      const sellVal = Math.round(sp.basePrice * getGlobalMultiplier() * getMarketMult(sp.rarity));
      iconEl.textContent = sp.emoji;
      titleEl.innerHTML = `<span class="text-[10px] px-1.5 py-0.5 rounded mr-1 ${rm.badge}">${rm.tag}·${rm.label}</span><span style="color:${rm.color}">#${sp.no} ${sp.name}</span> <span class="text-xs font-normal text-slate-400">${state.pendingCatch.weight}kg</span>`;
      descEl.textContent = `${sp.zone} · 卖价 🪙${sellVal.toLocaleString()} · 入缸 +${sp.cps}/s · 喂猫 +${sp.exp} EXP`;
      document.getElementById('sellCatchBtn').textContent = `卖出 🪙${sellVal}`;
      actionsEl.classList.remove('hidden');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function renderTabContent() {
      const container = document.getElementById('tabContent');
      document.querySelectorAll('.tab-btn').forEach(btn => {
        const active = btn.dataset.tab === state.activeTab;
        btn.className = `tab-btn py-1.5 rounded-lg text-[11px] font-semibold transition ${
          active ? 'bg-sky-500 text-slate-950 shadow' : 'text-slate-300 hover:text-white'
        }`;
      });

      if (state.activeTab === 'play') {
        const questsHtml = QUEST_TEMPLATES.map(q => {
          const tier = state.questTiers[q.id] || 0;
          const goal = Math.round(q.baseGoal * Math.pow(q.mult, tier));
          const curVal = q.stat === 'dexCount' ? Object.keys(state.dex).length : (state.stats[q.stat] || 0);
          const done = curVal >= goal;
          const pct = Math.min(100, Math.round((curVal / goal) * 100));
          const rewardC = Math.round(q.rewardCoins * Math.pow(1.9, tier));
          return `
            <div class="bg-slate-900/75 border ${done ? 'border-emerald-400/60' : 'border-slate-700/70'} rounded-xl p-2 flex items-center justify-between gap-2">
              <div class="min-w-0 flex-1">
                <div class="flex items-center justify-between text-xs">
                  <span class="font-bold text-slate-100">${q.title} <span class="text-[10px] text-slate-400 font-normal">${q.desc} (${Math.min(curVal, goal)}/${goal})</span></span>
                </div>
                <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mt-1">
                  <div class="h-full ${done ? 'bg-emerald-400' : 'bg-sky-400'}" style="width:${pct}%"></div>
                </div>
              </div>
              <button data-claim-quest="${q.id}" ${done ? '' : 'disabled'} class="claim-quest-btn shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
                done ? 'bg-emerald-400 hover:bg-emerald-300 text-slate-950 animate-pulse' : 'bg-slate-800 text-slate-500'
              }">
                ${done ? `领 🪙${rewardC}` : `🪙${rewardC}`}
              </button>
            </div>
          `;
        }).join('');

        const zonesHtml = OCEAN_ZONES.map(z => {
          const unlocked = state.unlockedZones.includes(z.id);
          const current = state.zoneId === z.id;
          return `
            <div class="bg-slate-900/70 border ${current ? 'border-sky-400/80' : 'border-slate-700/70'} rounded-xl p-2 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-lg shrink-0">${z.icon}</div>
                <div class="min-w-0">
                  <div class="text-xs font-bold text-slate-100">${z.name} <span class="text-emerald-400 font-normal">×${z.mult}</span></div>
                  <div class="text-[10px] text-slate-400 truncate">${z.desc}</div>
                </div>
              </div>
              <button data-zone-id="${z.id}" class="zone-btn shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
