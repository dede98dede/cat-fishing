              <button id="copyInviteBtn" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 text-xs font-semibold transition">📋 邀请好友</button>
            </div>
          </div>
          <div class="space-y-1.5">
            <div class="text-[11px] text-slate-400 px-0.5">同塘好友 (${online.friends.length + 1} 人在线 · 共享加成 +${getCoopBonusPct()}%)</div>
            ${friendRows}
          </div>
          <div class="bg-slate-900/75 border border-slate-700/70 rounded-xl p-2.5 space-y-2">
            <div class="text-[11px] font-semibold text-slate-300">💬 鱼塘实时弹幕</div>
            <div class="space-y-1 max-h-24 overflow-y-auto custom-scroll pr-1">${chatRows}</div>
            <div class="flex gap-1 flex-wrap">
              <button data-quick-chat="🐟 出神话海鱼了！" class="quick-chat-btn px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[10px] text-slate-300">🐟 出神话鱼了</button>
              <button data-quick-chat="🔥 黄金鱼潮冲冲冲" class="quick-chat-btn px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[10px] text-slate-300">🔥 黄金鱼潮</button>
              <button data-quick-chat="❤️ 贴贴猫猫" class="quick-chat-btn px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[10px] text-slate-300">❤️ 贴贴</button>
            </div>
            <div class="flex gap-1.5">
              <input id="chatInput" type="text" placeholder="发一句弹幕..." class="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-2 py-1 text-xs text-white focus:outline-none focus:border-sky-400" />
              <button id="sendChatBtn" class="px-3 py-1 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold transition">发送</button>
            </div>
          </div>
        `;
      }
    }

    // =========================================================
    // 8. Canvas Rendering (Zone-themed Ocean + Evolving Cats)
    // =========================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let cw = 600, ch = 320;

    function resizeCanvas() {
      const rect = document.getElementById('canvasContainer').getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      cw = Math.max(260, rect.width); ch = Math.max(220, rect.height);
      canvas.width = Math.floor(cw * dpr); canvas.height = Math.floor(ch * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawCat(x, y, t, opts) {
      const skin = CAT_SKINS.find(s => s.id === opts.skinId) || CAT_SKINS[0];
      const sc = opts.scale || 1;
      const lv = opts.level || 1;
      const glam = opts.glamour || 0;
      const breathe = Math.sin(t * 3.2 + (opts.phase || 0)) * 1.4;

      ctx.save();
      ctx.translate(x, y + breathe);
      ctx.scale(sc, sc);

      if (lv >= 8 || glam >= 2) {
        const auraR = 30 + Math.min(18, glam * 1.4 + (lv >= 16 ? 8 : 0));
        const grad = ctx.createRadialGradient(0, -4, 6, 0, -4, auraR);
        if (lv >= 16) {
          grad.addColorStop(0, 'rgba(244, 114, 182, 0.55)');
          grad.addColorStop(0.55, 'rgba(56, 189, 248, 0.30)');
          grad.addColorStop(1, 'rgba(56, 189, 248, 0)');
        } else if (lv >= 12) {
          grad.addColorStop(0, 'rgba(250, 204, 21, 0.45)');
          grad.addColorStop(1, 'rgba(250, 204, 21, 0)');
        } else {
          grad.addColorStop(0, 'rgba(168, 85, 247, 0.35)');
          grad.addColorStop(1, 'rgba(168, 85, 247, 0)');
        }
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, -4, auraR, 0, Math.PI * 2); ctx.fill();
      }

      if (lv >= 12) {
        ctx.fillStyle = lv >= 16 ? '#ec4899' : '#3b82f6';
        ctx.beginPath(); ctx.moveTo(-16, 2); ctx.quadraticCurveTo(-28, 18, -22, 28); ctx.lineTo(14, 26); ctx.quadraticCurveTo(22, 14, 14, 2); ctx.closePath(); ctx.fill();
      }

      const tailAngle = Math.sin(t * 4.5 + (opts.phase || 0)) * 0.35;
      ctx.save(); ctx.translate(-18, 12); ctx.rotate(tailAngle);
      ctx.strokeStyle = skin.coat; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-18, -10, -14, -26); ctx.stroke();
      ctx.restore();

      ctx.fillStyle = skin.coat; ctx.beginPath(); ctx.ellipse(0, 12, 22, 18, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = skin.belly; ctx.beginPath(); ctx.ellipse(3, 15, 11, 10, 0, 0, Math.PI * 2); ctx.fill();

      if (lv >= 3) {
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(-9, 0); ctx.lineTo(-9, 8); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(9, 0); ctx.lineTo(9, 8); ctx.closePath(); ctx.fill();
        ctx.fillStyle = lv >= 8 ? '#fbbf24' : '#fda4af';
        ctx.beginPath(); ctx.arc(0, 4, lv >= 8 ? 3.8 : 2.5, 0, Math.PI * 2); ctx.fill();
      }

      ctx.fillStyle = skin.ear;
      ctx.beginPath(); ctx.moveTo(-16, -12); ctx.lineTo(-20, -30); ctx.lineTo(-4, -20); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(16, -12); ctx.lineTo(20, -30); ctx.lineTo(4, -20); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fda4af';
      ctx.beginPath(); ctx.moveTo(-14, -15); ctx.lineTo(-17, -25); ctx.lineTo(-7, -19); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(14, -15); ctx.lineTo(17, -25); ctx.lineTo(7, -19); ctx.closePath(); ctx.fill();

      ctx.fillStyle = skin.coat; ctx.beginPath(); ctx.ellipse(0, -10, 21, 17, 0, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = skin.stripe; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-4, -24); ctx.lineTo(-3, -19); ctx.moveTo(0, -25); ctx.lineTo(0, -19); ctx.moveTo(4, -24); ctx.lineTo(3, -19); ctx.stroke();

      if (lv >= 3) {
        ctx.fillStyle = 'rgba(251, 113, 133, 0.45)';
        ctx.beginPath(); ctx.ellipse(-13, -5, 4, 2.2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(13, -5, 4, 2.2, 0, 0, Math.PI * 2); ctx.fill();
      }

      if (lv >= 8 && lv < 12) {
        ctx.fillStyle = '#0f172a'; ctx.fillRect(-15, -14, 12, 7); ctx.fillRect(3, -14, 12, 7);
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1.6; ctx.strokeRect(-15, -14, 12, 7); ctx.strokeRect(3, -14, 12, 7);
        ctx.beginPath(); ctx.moveTo(-3, -11); ctx.lineTo(3, -11); ctx.stroke();
      } else {
        ctx.strokeStyle = '#0f172a'; ctx.fillStyle = skin.id === 'ragdoll' ? '#0284c7' : '#0f172a'; ctx.lineWidth = 2.2;
        if (opts.happy) {
          ctx.beginPath(); ctx.arc(-8, -10, 4, Math.PI, 0); ctx.stroke();
          ctx.beginPath(); ctx.arc(8, -10, 4, Math.PI, 0); ctx.stroke();
        } else if (opts.blinking) {
          ctx.beginPath(); ctx.moveTo(-11, -10); ctx.lineTo(-5, -10); ctx.moveTo(5, -10); ctx.lineTo(11, -10); ctx.stroke();
        } else {
          ctx.beginPath(); ctx.arc(-8, -10, 3.3, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(8, -10, 3.3, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(-9, -11.2, 1.2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(7, -11.2, 1.2, 0, Math.PI * 2); ctx.fill();
        }
      }

      ctx.fillStyle = '#fb7185'; ctx.beginPath(); ctx.moveTo(-2.5, -6); ctx.lineTo(2.5, -6); ctx.lineTo(0, -3.5); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(-2.5, -3.5, 2.5, 0, Math.PI * 0.85); ctx.stroke();
      ctx.beginPath(); ctx.arc(2.5, -3.5, 2.5, Math.PI * 0.15, Math.PI); ctx.stroke();

      if (lv >= 5 && lv < 12) {
        ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.ellipse(0, -25, 22, 5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(0, -26, 12, Math.PI, 0); ctx.fill();
        ctx.fillStyle = '#0ea5e9'; ctx.fillRect(-12, -28, 24, 3);
      }
      if (lv >= 12) {
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath(); ctx.moveTo(-12, -24); ctx.lineTo(-14, -37); ctx.lineTo(-5, -30); ctx.lineTo(0, -40); ctx.lineTo(5, -30); ctx.lineTo(14, -37); ctx.lineTo(12, -24); ctx.closePath(); ctx.fill();
        ctx.fillStyle = lv >= 16 ? '#f472b6' : '#38bdf8'; ctx.beginPath(); ctx.arc(0, -30, 3, 0, Math.PI * 2); ctx.fill();
      }

      const sparkCount = Math.min(6, (lv >= 16 ? 4 : lv >= 12 ? 2 : 0) + Math.floor(glam / 2));
      for (let i = 0; i < sparkCount; i++) {
        const ang = t * 2.2 + (i * Math.PI * 2) / Math.max(1, sparkCount);
        ctx.fillStyle = i % 2 === 0 ? '#fde047' : '#f0abfc';
        ctx.beginPath(); ctx.arc(Math.cos(ang) * 28, -8 + Math.sin(ang) * 20, 2.2, 0, Math.PI * 2); ctx.fill();
      }

      const rodSwing = (opts.castSwing || 0) * 0.35;
      ctx.save(); ctx.translate(16, 4); ctx.rotate(-0.55 - rodSwing);
      ctx.strokeStyle = lv >= 16 ? '#f472b6' : lv >= 12 ? '#fbbf24' : lv >= 5 ? '#38bdf8' : '#d97706';
      ctx.lineWidth = lv >= 12 ? 3.8 : 3.2;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(62, -20); ctx.stroke();
      ctx.restore();

      if (opts.label) {
        ctx.font = 'bold 11px Inter, sans-serif'; ctx.textAlign = 'center';
        ctx.fillStyle = opts.isSelf ? '#fde047' : '#bae6fd';
        ctx.fillText(opts.label, 0, lv >= 12 ? -45 : -38);
      }
      ctx.restore();
    }

    function drawFishSprite(f, t, isShared = false) {
      const sp = getFishById(f.speciesId);
      const fx = f.x * cw;
      const fy = f.y * ch + Math.sin(t * 3 + f.phase) * 3;
      const scale = 0.68 + ((f.growth || 50) / 100) * 0.45;
      const r = sp.size * scale;
      const dir = f.vx >= 0 ? 1 : -1;

      ctx.save(); ctx.translate(fx, fy); ctx.scale(dir, 1);
      const wag = Math.sin(t * 9 + f.phase) * 4;
      if (sp.shape === 'jelly') {
        ctx.fillStyle = sp.bodyColor; ctx.beginPath(); ctx.arc(0, 0, r * 0.72, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = sp.finColor; ctx.lineWidth = 2;
        for (let k = -2; k <= 2; k++) {
          ctx.beginPath(); ctx.moveTo(k * r * 0.22, 0); ctx.quadraticCurveTo(k * r * 0.25 + wag * 0.5, r * 0.6, k * r * 0.2, r * 1.1); ctx.stroke();
        }
      } else {
        const aspect = sp.shape === 'long' ? 0.34 : sp.shape === 'slim' ? 0.45 : sp.shape === 'flat' ? 0.8 : 0.62;
        ctx.fillStyle = sp.finColor;
        ctx.beginPath(); ctx.moveTo(-r * 0.85, 0); ctx.lineTo(-r * 1.55, -r * 0.55 + wag); ctx.lineTo(-r * 1.55, r * 0.55 + wag); ctx.closePath(); ctx.fill();
        ctx.fillStyle = sp.bodyColor; ctx.beginPath(); ctx.ellipse(0, 0, r, r * aspect, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = sp.finColor;
        ctx.beginPath(); ctx.moveTo(-r * 0.2, -r * aspect * 0.85); ctx.quadraticCurveTo(r * 0.1, -r * (aspect + 0.45), r * 0.38, -r * aspect * 0.8); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(r * 0.45, -r * 0.12, Math.max(2, r * 0.16), 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(r * 0.52, -r * 0.12, Math.max(1.1, r * 0.09), 0, Math.PI * 2); ctx.fill();
      }
      if (sp.rarity === 'mythic' || sp.rarity === 'legendary' || isShared) {
        ctx.fillStyle = sp.rarity === 'mythic' ? 'rgba(244, 114, 182, 0.9)' : isShared ? 'rgba(56, 189, 248, 0.75)' : 'rgba(254, 240, 138, 0.85)';
        ctx.beginPath(); ctx.arc(Math.sin(t * 5 + f.phase) * r * 0.6, -r * 0.78, 2.2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    function renderScene(t) {
      const waterY = ch * 0.46;
      const zone = getCurrentZone();

      const skyGrad = ctx.createLinearGradient(0, 0, 0, waterY);
      skyGrad.addColorStop(0, zone.skyTop);
      skyGrad.addColorStop(1, zone.skyBot);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, cw, waterY);

      ctx.fillStyle = '#fef3c7'; ctx.beginPath(); ctx.arc(cw * 0.88, ch * 0.14, 15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = zone.skyTop; ctx.beginPath(); ctx.arc(cw * 0.88 + 5, ch * 0.14 - 3, 13, 0, Math.PI * 2); ctx.fill();

      const dockW = cw * 0.50;
      ctx.fillStyle = '#78350f'; ctx.fillRect(0, waterY - 12, dockW, 14);
      ctx.fillStyle = '#92400e'; ctx.fillRect(0, waterY - 14, dockW, 5);
      ctx.fillStyle = '#451a03';
      ctx.fillRect(cw * 0.08, waterY, 9, ch - waterY);
      ctx.fillRect(cw * 0.28, waterY, 9, ch - waterY);
      ctx.fillRect(cw * 0.44, waterY, 9, ch - waterY);

      const myCatX = cw * 0.14;
      const myCatY = waterY - 36;
      drawCat(myCatX, myCatY, t, {
        skinId: state.cat.skin, level: state.cat.level, glamour: state.catUpgrades.glamour || 0,
        scale: 0.92, happy: catAnim.happyTimer > 0, blinking: catAnim.blinking, castSwing: catAnim.castSwing,
        label: state.nickname, isSelf: true, phase: 0
      });

      online.friends.slice(0, 2).forEach((fr, idx) => {
        drawCat(cw * (0.28 + idx * 0.13), waterY - 32, t, {
          skinId: fr.skin, level: fr.level || 1, glamour: fr.glamour || 0,
          scale: 0.78, happy: fr.happyTimer > 0, blinking: false, castSwing: 0,
          label: fr.nickname.replace('(好友演示)', ''), isSelf: false, phase: (idx + 1) * 1.4
        });
      });

      const waterGrad = ctx.createLinearGradient(0, waterY, 0, ch);
      waterGrad.addColorStop(0, runtime.feverLeft > 0 ? 'rgba(217, 119, 6, 0.78)' : zone.waterTop);
      waterGrad.addColorStop(0.5, zone.waterMid);
      waterGrad.addColorStop(1, 'rgba(8, 20, 42, 0.99)');
      ctx.fillStyle = waterGrad;
      ctx.fillRect(0, waterY, cw, ch - waterY);

      ctx.fillStyle = '#0f172a'; ctx.fillRect(0, ch - 18, cw, 18);
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.45)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const sx = cw * (0.12 + i * 0.16);
        const sway = Math.sin(t * 2 + i) * 8;
        ctx.beginPath(); ctx.moveTo(sx, ch - 12); ctx.quadraticCurveTo(sx + sway, ch - 42, sx + sway * 1.4, ch - 68); ctx.stroke();
      }

      for (const sf of online.sharedFish) drawFishSprite(sf, t, true);
      for (const f of state.tankFish) drawFishSprite(f, t, false);

      ctx.strokeStyle = 'rgba(186, 230, 253, 0.45)'; ctx.lineWidth = 1.2;
      for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x * cw, b.y * ch, b.r, 0, Math.PI * 2); ctx.stroke(); }

      ctx.strokeStyle = runtime.feverLeft > 0 ? 'rgba(253, 224, 71, 0.9)' : 'rgba(125, 211, 252, 0.65)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let x = 0; x <= cw; x += 12) {
        const wy = waterY + Math.sin(x * 0.03 + t * 3) * 2.5;
        if (x === 0) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
      }
      ctx.stroke();

      online.friends.slice(0, 2).forEach((fr, idx) => {
        if (fr.fishingPhase !== 'waiting') return;
        const fx = cw * (0.28 + idx * 0.13) + 46, fy = waterY - 62;
        const bx = fr.bobberX * cw, by = waterY + 4 + Math.sin(t * 4 + idx) * 2;
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(fx, fy); ctx.quadraticCurveTo((fx + bx) / 2, waterY - 18, bx, by); ctx.stroke();
        ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI * 2); ctx.fill();
      });

      const rodTipX = myCatX + 54, rodTipY = myCatY - 40;
      if (fishing.phase === 'waiting' || fishing.phase === 'biting') {
        const bx = fishing.bobberX * cw;
        const biteDip = fishing.phase === 'biting' ? Math.sin(t * 28) * 6 + 6 : Math.sin(t * 4) * 2;
        const by = waterY + 4 + biteDip;
        ctx.strokeStyle = 'rgba(226, 232, 240, 0.7)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(rodTipX, rodTipY); ctx.quadraticCurveTo((rodTipX + bx) / 2, waterY - 22, bx, by); ctx.stroke();
        const rippleR = fishing.phase === 'biting' ? 14 + ((t * 40) % 18) : 6 + ((t * 14) % 10);
        ctx.strokeStyle = fishing.phase === 'biting' ? 'rgba(251, 113, 133, 0.8)' : 'rgba(186, 230, 253, 0.5)';
        ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(bx, waterY + 4, rippleR, rippleR * 0.3, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(bx, by, 5.5, Math.PI, 0); ctx.fill();
        ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.arc(bx, by, 5.5, 0, Math.PI); ctx.fill();
      }

      ctx.font = 'bold 13px Inter, sans-serif'; ctx.textAlign = 'center';
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
        ctx.fillText(p.text, p.x * cw, p.y * ch);
      }
      ctx.globalAlpha = 1;
    }

    // =========================================================
    // 9. Main Loop
    // =========================================================
    let lastTime = performance.now();
    let uiTickAccum = 0, saveTickAccum = 0, rafId = null;

    function tick(now) {
      const dt = Math.min(0.1, (now - lastTime) / 1000);
      lastTime = now;
      const t = now / 1000;

      state.coins += getTotalCps() * dt;
      state.cat.mood = Math.max(20, state.cat.mood - 0.12 * dt);
      state.cat.hunger = Math.max(15, state.cat.hunger - 0.15 * dt);
      if (catAnim.happyTimer > 0) catAnim.happyTimer = Math.max(0, catAnim.happyTimer - dt);
      if (catAnim.castSwing > 0) catAnim.castSwing = Math.max(0, catAnim.castSwing - dt * 3);
      catAnim.blinkTimer -= dt;
      if (catAnim.blinkTimer <= 0) {
        catAnim.blinking = !catAnim.blinking;
        catAnim.blinkTimer = catAnim.blinking ? 0.14 : 2.2 + Math.random() * 2.5;
      }

      // Fever countdown
      if (runtime.feverLeft > 0) {
        runtime.feverLeft = Math.max(0, runtime.feverLeft - dt);
        if (runtime.feverLeft === 0) showToast('黄金鱼潮结束了，继续钓鱼充能吧！', 'info');
      }

      // Pomodoro countdown
      if (runtime.pomoActive) {
        runtime.pomoLeftSec -= dt;
        if (runtime.pomoLeftSec <= 0) {
          runtime.pomoActive = false;
          const rewardFish = rollFish(true, 'epic');
          recordDex(rewardFish.speciesId, rewardFish.weight);
          state.pendingCatch = rewardFish;
          state.chests = (state.chests || 0) + 1;
          const bonusGold = Math.round(350 * getGlobalMultiplier());
          state.coins += bonusGold;
          playSound('catch');
          const sp = getFishById(rewardFish.speciesId);
          showModal('⏱️ 专注摸鱼完成！', `恭喜完成专注！获得【${RARITY_META[sp.rarity].label}】${sp.name} + 🪙${bonusGold.toLocaleString()} + 1个沉船宝箱 🎁`, false);
          renderCatchCard(); renderHeader(); renderTabContent(); saveGame();
        }
      }

      if (fishing.phase === 'waiting') {
        fishing.timer -= dt;
        if (fishing.timer <= 0) {
          fishing.phase = 'biting'; fishing.biteWindow = 2.6;
          playSound('bite'); updateFishingUI();
        }
      } else if (fishing.phase === 'biting') {
        fishing.biteWindow -= dt;
        if (fishing.biteWindow <= 0) {
          fishing.phase = 'idle'; showToast('海鱼跑掉了，下次咬钩时手快一点！', 'warn'); updateFishingUI();
        }
      }

      if ((state.upgrades.autoFish || 0) > 0) {
        const interval = Math.max(1.6, 8.2 - state.upgrades.autoFish * 0.6);
        fishing.autoTimer += dt;
        if (fishing.autoTimer >= interval) {
          fishing.autoTimer = 0;
          triggerAutoFish();
        }
      }

      online.friends.forEach((fr) => { if (fr.happyTimer > 0) fr.happyTimer = Math.max(0, fr.happyTimer - dt); });

      const growthSpeed = (1.6 + (state.upgrades.fishFood || 0) * 0.4) * dt;
      for (let i = state.tankFish.length - 1; i >= 0; i--) {
        const f = state.tankFish[i];
        f.x += f.vx * dt; f.y += f.vy * dt;
        if (f.x < 0.08) { f.x = 0.08; f.vx = Math.abs(f.vx); }
        if (f.x > 0.92) { f.x = 0.92; f.vx = -Math.abs(f.vx); }
        if (f.y < 0.54) { f.y = 0.54; f.vy = Math.abs(f.vy); }
        if (f.y > 0.90) { f.y = 0.90; f.vy = -Math.abs(f.vy); }
        if (f.growth < 100) f.growth = Math.min(100, f.growth + growthSpeed);
        // Smart auto-sell maxed common/uncommon fish when tank is full & autoSell unlocked
        if ((state.upgrades.autoSell || 0) > 0 && f.growth >= 100 && state.tankFish.length >= getTankCapacity() && getFishById(f.speciesId).rank <= 2) {
          const p = getFishSellPrice(f);
          state.coins += p;
          state.tankFish.splice(i, 1);
          spawnParticles(f.x, f.y, `🤖+🪙${p}`, '#34d399');
        }
      }
      for (const sf of online.sharedFish) {
        sf.x += sf.vx * dt; sf.y += sf.vy * dt;
        if (sf.x < 0.08) { sf.x = 0.08; sf.vx = Math.abs(sf.vx); }
        if (sf.x > 0.92) { sf.x = 0.92; sf.vx = -Math.abs(sf.vx); }
        if (sf.y < 0.54) { sf.y = 0.54; sf.vy = Math.abs(sf.vy); }
        if (sf.y > 0.90) { sf.y = 0.90; sf.vy = -Math.abs(sf.vy); }
      }

      for (const b of bubbles) {
        b.y -= b.speed * dt;
        if (b.y < 0.47) { b.y = 0.96; b.x = Math.random(); }
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.y += p.vy * dt; p.life -= dt * 0.9;
        if (p.life <= 0) particles.splice(i, 1);
      }

      renderScene(t);

      uiTickAccum += dt;
      if (uiTickAccum >= 0.5) {
        uiTickAccum = 0;
        renderHeader();
        if (state.activeTab === 'tank' || state.activeTab === 'shop' || state.activeTab === 'play') {
          renderTabContent();
        }
      }

      if (online.mode === 'demo') {
        fishMarket.tickAccum += dt;
        if (fishMarket.tickAccum >= 3.5) {
          fishMarket.tickAccum = 0;
          stepLocalFishMarket();
        }
      }

      saveTickAccum += dt;
      if (saveTickAccum >= 8) { saveTickAccum = 0; saveGame(); }

      rafId = requestAnimationFrame(tick);
    }

    // =========================================================
    // 10. Events & Init
    // =========================================================
    function applyWidgetMode() {
      const shell = document.getElementById('appShell');
      const grid = document.getElementById('mainGrid');
      const sceneCol = document.getElementById('sceneCol');
      const panelCol = document.getElementById('panelCol');
      const btn = document.getElementById('toggleModeBtn');
      if (state.widgetMode) {
        shell.classList.add('widget-mode-shell');
        grid.className = 'grid grid-cols-1 gap-3';
        sceneCol.className = 'flex flex-col gap-3';
        panelCol.className = 'glass-panel rounded-2xl p-3 flex flex-col h-[360px]';
        btn.textContent = '🖥️ 展开';
      } else {
        shell.classList.remove('widget-mode-shell');
        grid.className = 'grid grid-cols-1 lg:grid-cols-12 gap-3';
        sceneCol.className = 'lg:col-span-7 flex flex-col gap-3';
        panelCol.className = 'lg:col-span-5 glass-panel rounded-2xl p-3 flex flex-col h-[480px] lg:h-[530px]';
        btn.textContent = '🪟 小窗';
      }
      setTimeout(resizeCanvas, 60);
    }

    function bindEvents() {
      document.getElementById('fishBtn').addEventListener('click', handleFishingAction);
      document.getElementById('petBtn').addEventListener('click', petCat);
      document.getElementById('feverBtn').addEventListener('click', activateFever);
      document.getElementById('openChestBtn').addEventListener('click', openTreasureChest);
      document.getElementById('keepFishBtn').addEventListener('click', keepPendingFish);
      document.getElementById('feedCatBtn').addEventListener('click', feedPendingFish);
      document.getElementById('craftCanBtn').addEventListener('click', craftCanFromPending);
      document.getElementById('sellCatchBtn').addEventListener('click', sellPendingFish);
      document.getElementById('roomBadgeBtn').addEventListener('click', () => { state.activeTab = 'online'; renderTabContent(); });
      document.getElementById('marketHeaderBtn').addEventListener('click', () => { state.activeTab = 'play'; renderTabContent(); });

      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const nx = (e.clientX - rect.left) / rect.width;
        const ny = (e.clientY - rect.top) / rect.height;
        if (nx < 0.22 && ny < 0.48) petCat();
        else if (nx < 0.48 && ny < 0.48 && online.friends.length > 0) petFriendCat(online.friends[nx < 0.35 ? 0 : Math.min(1, online.friends.length - 1)].id);
        else handleFishingAction();
      });

      window.addEventListener('keydown', (e) => {
        const tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        if (e.code === 'Space' && document.getElementById('modalOverlay').classList.contains('hidden')) {
          e.preventDefault(); handleFishingAction();
        }
      });

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => { state.activeTab = btn.dataset.tab; renderTabContent(); });
      });

      document.getElementById('tabContent').addEventListener('click', (e) => {
        const sellBtn = e.target.closest('.sell-tank-btn');
        if (sellBtn) { sellTankFish(sellBtn.dataset.sellUid); return; }

        const feedTankBtn = e.target.closest('.feed-tank-btn');
        if (feedTankBtn) { feedTankFish(feedTankBtn.dataset.feedUid); return; }

        const upgBtn = e.target.closest('.buy-upgrade-btn');
        if (upgBtn && !upgBtn.disabled) { buyUpgrade(upgBtn.dataset.upgradeId); return; }

        const catUpgBtn = e.target.closest('.buy-cat-upgrade-btn');
        if (catUpgBtn && !catUpgBtn.disabled) { buyCatUpgrade(catUpgBtn.dataset.catUpgradeId); return; }

        const buyCanBtn = e.target.closest('.buy-can-btn');
        if (buyCanBtn) { buyCatCan(buyCanBtn.dataset.canId); return; }
        if (e.target.closest('#useHomemadeCanBtn')) { useHomemadeCan(); return; }

        const skinBtn = e.target.closest('.skin-btn');
        if (skinBtn) { selectOrBuySkin(skinBtn.dataset.skinId); return; }

        const zoneBtn = e.target.closest('.zone-btn');
        if (zoneBtn) { unlockOrSwitchZone(zoneBtn.dataset.zoneId); return; }

        const buyShareBtn = e.target.closest('.buy-share-btn');
        if (buyShareBtn) { buyMarketShare(buyShareBtn.dataset.buyShare); return; }

        const sellShareBtn = e.target.closest('.sell-share-btn');
        if (sellShareBtn && !sellShareBtn.disabled) { sellMarketShare(sellShareBtn.dataset.sellShare); return; }

        const questBtn = e.target.closest('.claim-quest-btn');
        if (questBtn && !questBtn.disabled) { claimQuest(questBtn.dataset.claimQuest); return; }

        const pomoBtn = e.target.closest('.pomo-btn');
        if (pomoBtn) { togglePomodoro(Number(pomoBtn.dataset.pomoMin)); return; }

        if (e.target.closest('#prestigeBtn')) { doPrestige(); return; }

        const petFriendBtn = e.target.closest('.pet-friend-btn');
        if (petFriendBtn) { petFriendCat(petFriendBtn.dataset.petFriend); return; }

        const qChatBtn = e.target.closest('.quick-chat-btn');
        if (qChatBtn) { sendChat(qChatBtn.dataset.quickChat); return; }

        const dexFilterBtn = e.target.closest('.dex-filter-btn');
        if (dexFilterBtn) { state.dexFilter = dexFilterBtn.dataset.dexFilter; state.dexPage = 1; renderTabContent(); return; }
        if (e.target.closest('#dexPrevBtn')) { state.dexPage = Math.max(1, (state.dexPage || 1) - 1); renderTabContent(); return; }
        if (e.target.closest('#dexNextBtn')) { state.dexPage = (state.dexPage || 1) + 1; renderTabContent(); return; }

        if (e.target.closest('#joinRoomBtn')) { joinRoom(document.getElementById('nickInput')?.value, document.getElementById('roomInput')?.value); return; }
        if (e.target.closest('#copyInviteBtn')) { copyInviteLink(); return; }
        if (e.target.closest('#sendChatBtn')) {
          const inp = document.getElementById('chatInput');
          if (inp && inp.value.trim()) { sendChat(inp.value); inp.value = ''; }
        }
      });

      document.getElementById('tabContent').addEventListener('input', (e) => {
        if (e.target.id === 'dexSearchInput') {
          state.dexSearch = e.target.value; state.dexPage = 1;
          const pos = e.target.selectionStart;
          renderTabContent();
          const newInp = document.getElementById('dexSearchInput');
          if (newInp) { newInp.focus(); newInp.setSelectionRange(pos, pos); }
        }
      });

      document.getElementById('tabContent').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.id === 'chatInput') { sendChat(e.target.value); e.target.value = ''; }
      });

      document.getElementById('toggleModeBtn').addEventListener('click', () => { state.widgetMode = !state.widgetMode; applyWidgetMode(); saveGame(); });
      document.getElementById('muteBtn').addEventListener('click', () => {
        state.muted = !state.muted;
        document.getElementById('muteBtn').textContent = state.muted ? '🔇 静音' : '🔊 音效';
        saveGame();
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        showModal('重置游戏进度', '确定要清空所有金币、珍珠、海域、猫咪等级和900种海鱼图鉴重新开始吗？', true, () => {
          state = createDefaultState(); fishing.phase = 'idle'; runtime.feverLeft = 0; runtime.pomoActive = false;
          saveGame(); applyWidgetMode(); renderHeader(); renderCatchCard(); updateFishingUI(); renderTabContent();
          showToast('进度已重置，重新开始海钓摸鱼吧！', 'info');
        });
      });

      document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
      document.getElementById('modalConfirmBtn').addEventListener('click', () => { const cb = modalCallback; closeModal(); if (cb) cb(); });
      window.addEventListener('resize', resizeCanvas);
    }

    window.onload = () => {
      loadGame();
      const qsRoom = new URLSearchParams(window.location.search).get('room');
      if (qsRoom) state.roomId = qsRoom.replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 16) || 'public';
      connectWebSocket();
      setInterval(() => { if (online.connected) syncMyStateToServer(); }, 5000);
      document.getElementById('muteBtn').textContent = state.muted ? '🔇 静音' : '🔊 音效';
      bindEvents();
      applyWidgetMode();
      resizeCanvas();
      renderHeader();
      renderCatchCard();
      updateFishingUI();
      renderTabContent();
      if (rafId) cancelAnimationFrame(rafId);
      lastTime = performance.now();
      rafId = requestAnimationFrame(tick);
    };
  </script>
</body>
